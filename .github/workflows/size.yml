name: Size

permissions: {}

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"

concurrency:
  group: size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
        with:
          # the merge commit and its parents, the first parent is the base the pull request is compared with
          fetch-depth: 2
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Measure
        run: pnpm size --base HEAD^1 --out size-report

      - name: Summary
        run: cat size-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-report
          path: size-report/report.json
          retention-days: 7
